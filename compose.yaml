services:
  mongodb:
    image: mongo:7
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:?Set MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD}
    ports:
      - '127.0.0.1:8081:8081'

volumes:
  mongodb-data:
